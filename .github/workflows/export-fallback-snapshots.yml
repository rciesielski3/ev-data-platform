name: Export fallback snapshots from DB

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - run: npx prisma generate

      - run: npx tsx src/server/jobs/export-fallback-snapshots-from-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FALLBACK_OUTPUT_DIR: ${{ runner.temp }}/fallback-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: fallback-snapshots
          path: |
            ${{ runner.temp }}/fallback-snapshots/stations.json
            ${{ runner.temp }}/fallback-snapshots/vehicles.json
          if-no-files-found: error
          retention-days: 14
