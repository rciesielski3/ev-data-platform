name: Import EIPA charging stations

on:
  # Cron paused: Neon free-tier CU quota exhausted until 2026-11-01. Re-enable with: cron: "0 5,17 * * *"
  workflow_dispatch:

jobs:
  import-eipa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npx prisma generate

      - run: npm run import:eipa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
