name: Import EIPA charging stations

on:
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch:
    inputs:
      prune_dry_run:
        description: "Log stale stations that would be pruned without deleting them"
        type: boolean
        default: false

jobs:
  import-eipa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npx prisma generate

      - run: npm run import:eipa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EIPA_PRUNE_DRY_RUN: ${{ inputs.prune_dry_run && '1' || '' }}
